<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#fbfbfd"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <line x1="140" y1="520" x2="140" y2="120" stroke="#111111" stroke-width="4"/>
  <line x1="140" y1="520" x2="1090" y2="520" stroke="#111111" stroke-width="4"/>
  <polygon points="140,108 131,130 149,130" fill="#111111"/>
  <polygon points="1102,520 1080,511 1080,529" fill="#111111"/>

  <line x1="140" y1="455" x2="1080" y2="455" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
  <path d="M140 510 C 280 330 480 300 700 292 S 960 286 1080 284" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/>
  <line x1="140" y1="520" x2="1080" y2="210" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
  <path d="M140 520 C 360 515 560 480 720 340 S 960 190 1080 130" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>

  <g font-family="monospace" font-size="26" font-weight="700" text-anchor="end">
    <text x="1078" y="443" fill="#2563eb">O(1)</text>
    <text x="1078" y="272" fill="#ea580c">O(log n)</text>
    <text x="1078" y="198" fill="#2563eb">O(n)</text>
    <text x="995" y="152" fill="#dc2626">O(n^2)</text>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="1150" y="64" font-size="50" font-weight="800" fill="#111111" text-anchor="end">Big O Notation</text>
    <text x="1150" y="100" font-size="20" font-weight="700" letter-spacing="3" fill="#6b7280" text-anchor="end">COMPLEXITY</text>
  </g>
</svg>
