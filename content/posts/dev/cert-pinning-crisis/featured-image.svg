<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Accent Glow -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Left Side: Title Text -->
  <g transform="translate(100, 220)">
    <!-- Badge -->
    <rect x="0" y="0" width="210" height="36" rx="18" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="1">BANK OF THAILAND</text>
    
    <!-- Main Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff">BOT Cert Pinning</text>
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" fill="url(#accent)">&amp; Short SSL Lifespan</text>
    
    <!-- Subtitle -->
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8">Resilient Mobile Banking Architecture with SPKI Pinning</text>
  </g>

  <!-- Right Side: Graphic Visual -->
  <g transform="translate(820, 315)">
    <!-- Shield Outer Ring -->
    <circle r="160" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
    <circle r="130" fill="#1e293b" stroke="#34d399" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Security Lock Icon -->
    <path d="M-30,-10 L30,-10 C35,-10 40,-5 40,0 L40,40 C40,45 35,50 30,50 L-30,50 C-35,50 -40,45 -40,40 L-40,0 C-40,-5 -35,-10 -30,-10 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <path d="M-20,-10 L-20,-25 C-20,-38 20,-38 20,-25 L20,-10" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="12" r="6" fill="#34d399"/>
    
    <!-- Short Lifespan Badge -->
    <g transform="translate(90, -80)">
      <rect x="-65" y="-18" width="130" height="36" rx="8" fill="#ef4444" filter="url(#glow)"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">SHORT LIFESPAN</text>
    </g>

    <!-- SPKI Hash Badge -->
    <g transform="translate(-100, 90)">
      <rect x="-65" y="-18" width="130" height="36" rx="8" fill="#0284c7" filter="url(#glow)"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">SPKI PINNING</text>
    </g>
  </g>
</svg>
