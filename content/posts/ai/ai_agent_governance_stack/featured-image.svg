<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="210" height="36" rx="18" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="1">AI AGENT GOVERNANCE</text>

    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Governance Stack</text>
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" fill="url(#accent)">for AI Coding Agents</text>

    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8">Intent / Process / Runtime: SPDD, Fable, Harness</text>
  </g>

  <g transform="translate(100, 545)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748b">Judge pass: VERIFIED / VERIFIED WITH CAVEATS / REFUTED</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#64748b">Kirby effect: every harness component has an expiry date</text>
  </g>

  <g transform="translate(820, 315)">
    <circle r="160" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
    <circle r="130" fill="#1e293b" stroke="#34d399" stroke-width="3" filter="url(#glow)"/>

    <rect x="-90" y="-63" width="180" height="32" rx="8" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="-43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">INTENT</text>

    <path d="M -6 -27 L 0 -21 L 6 -27" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="-90" y="-16" width="180" height="32" rx="8" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="2"/>
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">GATES</text>

    <path d="M -6 20 L 0 26 L 6 20" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="-90" y="31" width="180" height="32" rx="8" fill="#94a3b8" fill-opacity="0.12" stroke="#94a3b8" stroke-width="2"/>
    <text x="0" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">HARNESS</text>

    <g transform="translate(118, -96)">
      <rect x="-58" y="-16" width="116" height="32" rx="8" fill="#059669" filter="url(#glow)"/>
      <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">VERIFIED</text>
    </g>

    <g transform="translate(-112, 100)">
      <rect x="-56" y="-16" width="112" height="32" rx="8" fill="#d97706" filter="url(#glow)"/>
      <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">PENDING</text>
    </g>
  </g>
</svg>
